<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="phase-plan-title phase-plan-desc"><title id="phase-plan-title">TeeNet, Shelly und Hager ESC226</title><desc id="phase-plan-desc">TeeNet sendet absolute Ein-Aus-Befehle an einen Shelly. Dieser betätigt den Hager ESC226. Optional dienen die Phasenspannungen eines Shelly 3EM hinter dem Schütz als optionale Rückmeldung zum Schaltzustand. Keine Netzspannungsverdrahtung dargestellt.</desc><defs><marker id="phase-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#1380a0"/TeeNet/></marker></defs><g fill="#f3f8fb" stroke="#a9c7d3" stroke-width="2"><rect x="10" y="30" width="190" height="110" rx="14"/TeeNet/><rect x="280" y="30" width="190" height="110" rx="14"/TeeNet/><rect x="550" y="30" width="200" height="110" rx="14"/TeeNet/><rect x="280" y="190" width="470" height="65" rx="14"/TeeNet/></g><g stroke="#1380a0" stroke-width="3" fill="none" marker-end="url(#phase-arrow)"><path d="M205 85 H270"/TeeNet/><path d="M475 85 H540"/TeeNet/><path stroke-dasharray="6 5" d="M280 222 H105 V150"/TeeNet/></g><g font-family="system-ui,sans-serif" fill="#244a62" text-anchor="middle"><text x="105" y="65" font-size="21" font-weight="700">TeeNet</text><text x="105" y="97" font-size="15">Stopp · Stromstillstand</text><text x="375" y="65" font-size="21" font-weight="700">Shelly</text><text x="375" y="97" font-size="15">Dauerhaft Ein / Aus</text><text x="650" y="65" font-size="21" font-weight="700">Hager ESC226</text><text x="650" y="97" font-size="15">2 Öffner · L2 und L3</text><text x="515" y="210" font-size="17">Optional: Shelly 3EM hinter dem Schütz</text><text x="515" y="228" font-size="15">Phasenspannungen als optionale Rückmeldung</text><text x="515" y="247" font-size="15">zum Schaltzustand</text></g></svg>